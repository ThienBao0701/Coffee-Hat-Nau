# Copy this file to config.properties (same folder you run the app from) and adjust.
# config.properties is git-ignored: never commit real credentials.

# --- Option A (default): embedded H2 database, no installation needed. Data is kept in ./data/
db.url=jdbc:h2:./data/cafe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
db.user=sa
db.password=

# --- Option B: MySQL 8 (create the database first, see README)
#db.url=jdbc:mysql://localhost:3306/cafe_db?characterEncoding=UTF-8
#db.user=cafe_app
#db.password=CHANGE_ME

# Create tables when empty and apply additive, versioned migrations on existing databases.
db.autoInit=true
# Load demo catalog data (products, prices, tables, ingredients...) right after the tables are created.
# Demo data contains NO user accounts: the first owner is created in the first-run setup screen.
db.seedDemoData=true

# Optional one-time recovery for an existing ownerless database: an active manager can promote
# their own account after entering current credentials. Keep disabled for normal operation.
# Add -Dcafe.owner.bootstrap=true to JVM options only for that recovery.

# Shop information printed on receipts
shop.name=Cà Phê Hạt Nâu
shop.address=12 Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh
shop.phone=028 3822 1234

# Inventory policy: allow a sale to push ingredient stock below zero? (false = block the payment)
inventory.allowNegativeStockOnSale=false
# A reservation blocks its table for this many minutes
reservation.durationMinutes=120
